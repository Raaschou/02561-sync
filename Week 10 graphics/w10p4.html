<!doctype html>

<html>

<head>
    <meta charset="utf-8">
    <title>w10p4</title>
    <script type="text/javascript" src="../common_js/MV.js"></script>
    <script type="text/javascript" src="w10p4.js"></script>
    <script type="text/javascript" src="../common_js/subdiv_p2.js"></script>
    <script id="wgsl" type="x-shader" src="w10p4.wgsl"></script>
    <script type="text/javascript" src="../common_js/OBJParser.js"></script>
    <script type="text/javascript" src="../common_js/quaternion.js"></script>
    <style>
        div {
            display: flex;
            flex-direction: row;
            margin-right: 50px;
        }
    </style>
</head>

<body>
    <canvas width="512" height="512" oncontextmenu="return false;"></canvas>
    <div>
        <div style="flex-direction: column;">
            <div>
                <label for="L_e">Emitted radiance (L_e) 0.0</label>
                <input type="range" , id="L_e" , min="0.0" , max="2.0" , step="0.05">2.0</input>
            </div>
            <div>
                <label for="L_a">Ambient radiance (L_a) 0.0</label>
                <input type="range" , id="L_a" , min="0.0" , max="1.0" , step="0.05">1.0</input>
            </div>
            <div>
                <label for="k_d">Diffuse coefficient (k_d) 0.0</label>
                <input type="range" , id="k_d" , min="0.0" , max="1.0" , step="0.05">1.0</input>
            </div>
            <div>
                <label for="k_s">Specular coefficient (k_s) 0.0</label>
                <input type="range" , id="k_s" , min="0.0" , max="1.0" , step="0.05">1.0</input>
            </div>
            <div>
                <label for="s">Shininess (s) 0.0</label>
                <input type="range" , id="s" , min="0.1" , max="100" , step="0.1">100</input>
            </div>
        </div>
        <div style="flex-direction: column; ">
            <p>
                Left click is rotation, <br>
                Stop spinning with a single left click <br>
                Right click is dolly <br>
                Middle click is panning
            </p>
        </div>
    </div>

</body>

</html>
